<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
        <style>
                .button {
                        margin-top:20px;
                        }
        </style>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/register-login.css">
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Josefin+Sans" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <a href="login.php"><div class="backbutton"><i class="fa fa-arrow-left"></i></div></a>
    <div class="background" id="reset-back"></div>
    <div class="form-container" id="reset">
        <p class="title">Reset Password</p>
        <form id="resetPasswordForm" class="form">
            <div class="input-group">
                <label for="resetEmail">Email</label>
                <input type="email" name="resetEmail" id="resetEmail" required>
            </div>
            <div class="input-group">
                <label for="newPassword">New Password</label>
                <input type="password" name="newPassword" id="newPassword" required>
            </div>
            <button type="submit" class="button">Reset Password</button>
        </form>
    </div>

    <script>
        document.getElementById('resetPasswordForm').onsubmit = function(e) {
            e.preventDefault();
            var formData = new FormData(this);

            fetch('reset_password.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    if (data.redirect) {
                        window.location.href = data.redirect;
                    }
                } else {
                    alert(data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred. Please try again.');
            });
        }
    </script>
</body>
</html>
